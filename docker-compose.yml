version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: pdnspassword
      POSTGRES_DB: pdns_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdns"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # PD_API_BASE defaults to https://api.pagerduty.com in code if missing
    restart: always

  web:
    build:
      context: ./client
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
        VITE_WEBHOOK_BASE_URL: ${VITE_WEBHOOK_BASE_URL}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: always

volumes:
  postgres_data:
